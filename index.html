<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cyber security student Karar">
  <title>Karar Hashim | Cyber Security Student</title>
<style>
:root {
      --bg: #080d18;
      --panel: #101a2b;
      --panel-soft: #142139;
      --text: #edf4ff;
      --muted: #9aabc4;
      --blue: #4da3ff;
      --blue-light: #83c2ff;
      --line: rgba(148, 180, 220, .16);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 80% 5%, rgba(45, 122, 220, .17), transparent 28rem),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.65;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1040px, calc(100% - 40px)); margin: auto; }
    header {
      height: 76px; display: flex; align-items: center;
      justify-content: flex-start; border-bottom: 1px solid var(--line);
    }
    .brand { font-size: 19px; font-weight: 800; letter-spacing: 2px; }
    .brand span { color: var(--blue); }
    nav { display: flex; gap: 27px; color: var(--muted); font-size: 13px; }
    nav a:hover, .social a:hover { color: var(--blue-light); }
    .hero {
      min-height: 510px; display: grid; grid-template-columns: 1.25fr .75fr;
      align-items: center; gap: 55px; padding: 72px 0 65px;
    }
    .eyebrow {
      color: var(--blue-light); font-size: 12px; letter-spacing: 3px;
      text-transform: uppercase; font-weight: 700;
    }
    h1 { font-size: clamp(42px, 7vw, 68px); line-height: 1.08; margin: 17px 0 12px; letter-spacing: -2px; }
    h1 span { color: var(--blue); }
    .role { font-size: 20px; color: #c7d8ee; margin: 0 0 18px; }
    .intro { color: var(--muted); max-width: 510px; font-size: 15px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 11px 19px; border-radius: 7px; font-size: 13px; font-weight: 700;
      border: 1px solid var(--line); transition: .2s;
    }
    .btn.primary { background: var(--blue); color: #06101e; border-color: var(--blue); }
    .btn:hover { transform: translateY(-2px); }
    .photo-frame {
      width: min(100%, 310px); aspect-ratio: 4 / 5; margin: auto;
      border-radius: 18px; padding: 10px; background: linear-gradient(145deg, #347fca, #15253d 55%, #0b1423);
      box-shadow: 0 22px 65px rgba(0,0,0,.35);
    }
    .photo-placeholder {
      height: 100%; border-radius: 12px; border: 1px dashed rgba(180,210,245,.3);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; color: var(--muted); background: #0d1727; padding: 20px;
    }
    .photo-placeholder strong { color: var(--blue-light); font-size: 14px; margin-top: 12px; }
    .photo-placeholder small { font-size: 11px; margin-top: 5px; }
    .photo-icon { width: 58px; height: 58px; border-radius: 50%; background: #172b46; display:grid; place-items:center; color:var(--blue-light); font-size:26px; }
    section { padding: 35px 0 65px; }
    .section-label { color: var(--blue); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; font-weight: 700; }
    h2 { font-size: 27px; margin: 7px 0 18px; }
    .about-card {
      background: linear-gradient(135deg, rgba(20,33,57,.9), rgba(13,23,39,.9));
      border: 1px solid var(--line); border-radius: 13px; padding: 27px;
      color: var(--muted); max-width: 760px;
    }
    .social-list { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
    .social a {
      border: 1px solid var(--line); background: var(--panel);
      border-radius: 8px; padding: 11px 16px; color: #d9e8fa; font-size: 13px;
    }
    footer { border-top: 1px solid var(--line); padding: 22px 0; color: #71839d; font-size: 12px; text-align: center; }
    @media (max-width: 700px) {
      .wrap { width: min(100% - 30px, 540px); }
      header { height: auto; min-height: 70px; align-items: flex-start; padding: 20px 0; gap: 15px; flex-direction: column; }
      nav { gap: 18px; flex-wrap: wrap; }
      .hero { grid-template-columns: 1fr; gap: 35px; padding: 58px 0 40px; }
      .photo-frame { width: min(68%, 260px); grid-row: 1; }
      .hero-copy { grid-row: 2; }
      h1 { font-size: 48px; }
      section { padding-bottom: 48px; }
    }
    .hero-socials {
      display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
      margin-top: 18px;
    }
    .hero-social-link {
      width: 46px; height: 46px; display: inline-flex; align-items: center; justify-content: center;
      color: var(--blue-light); background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; transition: color .2s, background-color .2s, border-color .2s, transform .2s, box-shadow .2s;
    }
    .hero-social-link svg { width: 22px; height: 22px; }
    .hero-social-link:hover, .hero-social-link:focus-visible {
      color: #fff; background: #17365a; border-color: var(--blue);
      transform: translateY(-3px); box-shadow: 0 8px 22px rgba(45, 122, 220, .22);
    }
    .hero-social-link:focus-visible { outline: 2px solid var(--blue-light); outline-offset: 3px; }
    @media (max-width: 700px) {
      .hero-socials { gap: 10px; margin-top: 16px; }
      .hero-social-link { width: 44px; height: 44px; }
    }
/* Polished glass treatment for the hero portrait and social links */
.wrap { width: min(1080px, calc(100% - 48px)); }
header { height: 82px; }
.brand { font-size: 14px; letter-spacing: 3px; color: var(--muted); }
.hero {
  min-height: 560px; grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr);
  gap: clamp(36px, 7vw, 88px); padding: 76px 0 72px;
}
.hero-copy { max-width: 620px; }
.eyebrow { display: inline-flex; padding: 7px 12px; border: 1px solid rgba(131,194,255,.2); border-radius: 999px; background: rgba(77,163,255,.08); letter-spacing: 1.5px; }
h1 { font-size: clamp(46px, 6.5vw, 76px); line-height: 1.18; margin: 20px 0 12px; letter-spacing: 0; }
h1 span { color: var(--blue-light); text-shadow: 0 0 30px rgba(77,163,255,.22); }
.role { margin-bottom: 14px; }
.intro { line-height: 2; }
.photo-frame {
  position: relative; width: min(100%, 350px); padding: 10px; overflow: hidden;
  border: 1px solid rgba(199,225,255,.24); border-radius: 26px;
  background: linear-gradient(145deg, rgba(131,194,255,.35), rgba(20,33,57,.56) 45%, rgba(77,163,255,.12));
  box-shadow: 0 28px 80px rgba(0,0,0,.42), 0 0 45px rgba(45,122,220,.16), inset 0 1px rgba(255,255,255,.18);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  transition: transform .35s ease, box-shadow .35s ease;
}
.photo-frame::after {
  content: ""; position: absolute; inset: 10px; border-radius: 18px; pointer-events: none;
  background: linear-gradient(145deg, rgba(255,255,255,.2), transparent 32%, transparent 68%, rgba(77,163,255,.13));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.13);
}
.photo-frame:hover { transform: translateY(-6px) rotate(1deg); box-shadow: 0 34px 90px rgba(0,0,0,.5), 0 0 54px rgba(45,122,220,.24); }
.photo-frame img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 35%; border-radius: 18px; }
.hero-socials { gap: 14px; margin-top: 24px; }
.hero-social-link {
  width: 50px; height: 50px; color: #b8dcff;
  background: linear-gradient(145deg, rgba(255,255,255,.1), rgba(77,163,255,.06));
  border: 1px solid rgba(190,220,255,.22); border-radius: 16px;
  box-shadow: inset 0 1px rgba(255,255,255,.12), 0 8px 24px rgba(0,0,0,.18);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.hero-social-link svg { width: 23px; height: 23px; }
.hero-social-link:hover, .hero-social-link:focus-visible {
  color: #fff; background: linear-gradient(145deg, rgba(77,163,255,.28), rgba(20,33,57,.72));
  border-color: rgba(131,194,255,.65); transform: translateY(-5px);
  box-shadow: 0 12px 30px rgba(45,122,220,.24), inset 0 1px rgba(255,255,255,.2);
}
section { padding: 42px 0 72px; }
.about-card { line-height: 2; border-color: rgba(190,220,255,.18); box-shadow: 0 18px 50px rgba(0,0,0,.16), inset 0 1px rgba(255,255,255,.06); }
@media (max-width: 700px) {
  .wrap { width: min(100% - 32px, 540px); }
  header { min-height: 68px; height: 68px; padding: 0; align-items: center; flex-direction: row; }
  .hero { grid-template-columns: 1fr; gap: 30px; padding: 38px 0 44px; }
  .photo-frame { width: min(70%, 250px); grid-row: 1; }
  .hero-copy { grid-row: 2; }
  h1 { font-size: clamp(44px, 12vw, 58px); }
  .hero-socials { gap: 11px; margin-top: 20px; }
  .hero-social-link { width: 46px; height: 46px; border-radius: 14px; }
  section { padding: 30px 0 48px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
}

  </style>
